<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760"><rect width="1200" height="760" fill="#fafaf9"/><style>.title{font:700 30px Arial,sans-serif;fill:#111827}.card{fill:#fff;stroke:#111827;stroke-width:2;rx:18}.text{font:600 18px Arial,sans-serif;fill:#111827}.note{font:500 15px Arial,sans-serif;fill:#4b5563}</style><text x="60" y="70" class="title">Periastra Small-size &amp; Craft Fit</text><rect x="90" y="150" width="240" height="200" class="card"/><text x="125" y="210" class="text">16px / App icon</text><text x="125" y="250" class="note">check center void readability</text><rect x="380" y="150" width="240" height="200" class="card"/><text x="415" y="210" class="text">8mm / metal tag</text><text x="415" y="250" class="note">check break logic and line hierarchy</text><rect x="670" y="150" width="240" height="200" class="card"/><text x="705" y="210" class="text">20mm / woven label</text><text x="705" y="250" class="note">check black-white clarity</text><rect x="960" y="150" width="180" height="200" class="card"/><text x="985" y="210" class="text">deboss / plate</text><text x="985" y="250" class="note">check corners and closure</text><rect x="180" y="430" width="840" height="190" class="card"/><text x="220" y="490" class="text">Judgement rules</text><text x="220" y="530" class="note">- first read should still be P</text><text x="220" y="565" class="note">- center void must keep optics and breathing room</text><text x="220" y="600" class="note">- outer frame must still read as protective container</text></svg>
