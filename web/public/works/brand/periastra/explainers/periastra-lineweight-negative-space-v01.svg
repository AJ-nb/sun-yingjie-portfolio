<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760"><rect width="1200" height="760" fill="#fff"/><style>.title{font:700 30px Arial,sans-serif;fill:#111827}.subtitle{font:500 17px Arial,sans-serif;fill:#4b5563}.panel{fill:#f8fafc;stroke:#cbd5e1;stroke-width:2;rx:18}.text{font:600 18px Arial,sans-serif;fill:#111827}.note{font:500 15px Arial,sans-serif;fill:#4b5563}</style><text x="60" y="70" class="title">Periastra Lineweight &amp; Negative Space</text><rect x="80" y="140" width="500" height="520" class="panel"/><text x="120" y="190" class="text">Current issues</text><text x="120" y="235" class="note">- central spiral is too dense</text><text x="120" y="270" class="note">- hierarchy between frame and inner forms is weak</text><text x="120" y="305" class="note">- center void may collapse at small sizes</text><text x="120" y="340" class="note">- break looks unfinished</text><rect x="630" y="140" width="500" height="520" class="panel"/><text x="670" y="190" class="text">Optimization</text><text x="670" y="235" class="note">- keep main stem steady and inner spiral lighter</text><text x="670" y="270" class="note">- expand central breathing space</text><text x="670" y="305" class="note">- make break widths intentional</text><text x="670" y="340" class="note">- keep P as primary read, optics as secondary cue</text><text x="670" y="400" class="subtitle">Goal: move from conceptually strong to small-size and craft-ready.</text></svg>
