<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="960" viewBox="0 0 1440 960"><rect width="1440" height="960" fill="#f3f0e8"/><g font-family="Arial, Microsoft YaHei, sans-serif"><text x="80" y="85" fill="#68746d" font-size="20" letter-spacing="3">XHS OPERATIONS OS / METHOD STUDY</text><text x="80" y="160" fill="#1b302b" font-size="48" font-weight="700">先保留事实，再组织表达</text><text x="80" y="208" fill="#68746d" font-size="23">Evidence → Brief → Variants → Review → Package</text><path d="M180 350 H1260" stroke="#b3bdb3" stroke-width="3"/><g fill="#1b302b"><circle cx="180" cy="350" r="30"/><circle cx="450" cy="350" r="30"/><circle cx="720" cy="350" r="30"/><circle cx="990" cy="350" r="30"/><circle cx="1260" cy="350" r="30"/></g><g fill="#fff" text-anchor="middle" font-size="21"><text x="180" y="358">01</text><text x="450" y="358">02</text><text x="720" y="358">03</text><text x="990" y="358">04</text><text x="1260" y="358">05</text></g><g fill="#1b302b" text-anchor="middle" font-size="27" font-weight="700"><text x="180" y="428">产品事实</text><text x="450" y="428">内容简报</text><text x="720" y="428">候选表达</text><text x="990" y="428">人工复核</text><text x="1260" y="428">发布资料包</text></g><g fill="#68746d" text-anchor="middle" font-size="18"><text x="180" y="470">原始素材 / 来源 / 未知项</text><text x="450" y="470">对象 / 角度 / 保留约束</text><text x="720" y="470">文字 / 图像 / 版本</text><text x="990" y="470">事实 / 形态 / 规则</text><text x="1260" y="470">导出 / 手动发布 / 复盘</text></g><rect x="80" y="595" width="1280" height="205" rx="8" fill="#e0e5dc"/><text x="120" y="648" fill="#1b302b" font-size="22" font-weight="700">研究原则 / RESEARCH PRINCIPLES</text><text x="120" y="694" fill="#425c50" font-size="22">原始素材不被替换 · 推断不写成事实 · 指定修改与整体可用性分别验收</text><text x="120" y="738" fill="#425c50" font-size="19">Keep originals · Label inference · Review both requested edits and unintended changes</text><text x="80" y="884" fill="#68746d" font-size="18">方法示意，非运行界面。当前实现为 Foundation Shell（P0 / Task 4）。</text><text x="80" y="916" fill="#68746d" font-size="16">Method diagram, not an application screenshot. Implementation is at the foundation-shell stage.</text></g></svg>