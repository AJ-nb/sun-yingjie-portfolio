<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 760" role="img" aria-labelledby="title desc">
  <title id="title">Prompt architecture for the AI video case</title><desc id="desc">A structured prompt has objective, reference, invariants, camera, timeline, action, audio, end state and evaluation criteria.</desc>
  <rect width="1600" height="760" fill="#121212"/><g font-family="Arial, Noto Sans SC, sans-serif"><text x="82" y="92" fill="#c84936" font-size="24" letter-spacing="4">PROMPT AS DESIGN SPECIFICATION</text><text x="82" y="151" fill="#f3f2ee" font-size="56" letter-spacing="-2">STRUCTURE BEFORE STYLE</text></g>
  <g fill="none" stroke="#5c5b57" stroke-width="2"><rect x="82" y="225" width="1436" height="344"/><path d="M441 225v344M800 225v344M1159 225v344M82 397h1436"/></g>
  <g font-family="Arial, Noto Sans SC, sans-serif"><g fill="#f3f2ee" font-size="26"><text x="108" y="284">OBJECTIVE</text><text x="468" y="284">REFERENCE</text><text x="828" y="284">INVARIANTS</text><text x="1187" y="284">CAMERA</text><text x="108" y="456">TIMELINE</text><text x="468" y="456">ACTION CHAIN</text><text x="828" y="456">END STATE</text><text x="1187" y="456">EVALUATION</text></g><g fill="#a9a69e" font-size="17"><text x="108" y="324">story function</text><text x="468" y="324">look, motion language</text><text x="828" y="324">identity, exclusions</text><text x="1187" y="324">frame, path, hand-off</text><text x="108" y="496">timed beats</text><text x="468" y="496">cause → effect</text><text x="828" y="496">visible resolution</text><text x="1187" y="496">compare / diagnose</text></g></g>
  <text x="82" y="665" font-family="Arial, Noto Sans SC, sans-serif" font-size="27" fill="#f3f2ee">Human review checks whether the intended relation survives the generated image, movement and cut.</text>
</svg>
