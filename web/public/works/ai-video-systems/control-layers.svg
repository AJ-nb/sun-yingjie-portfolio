<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 980" role="img" aria-labelledby="title desc">
  <title id="title">Six control layers for an AI video workflow</title><desc id="desc">Six numbered layers organize intent, identity, time, physical logic, camera and evaluation.</desc>
  <rect width="1600" height="980" fill="#e9e8e3"/><g font-family="Arial, Noto Sans SC, sans-serif"><text x="86" y="100" fill="#b83a29" font-size="24" letter-spacing="4">AUTHORED CONTROL MODEL</text><text x="86" y="165" fill="#141414" font-size="58" letter-spacing="-2">SIX LAYERS BEFORE RENDER</text></g>
  <g font-family="Arial, Noto Sans SC, sans-serif" fill="#141414"><g transform="translate(86 255)"><rect width="438" height="170" fill="#d8d7d1"/><text x="26" y="46" font-size="17" fill="#b83a29">01 / INTENT</text><text x="26" y="93" font-size="33">Narrative objective</text><text x="26" y="130" font-size="19">what must change and why</text></g><g transform="translate(581 255)"><rect width="438" height="170" fill="#d8d7d1"/><text x="26" y="46" font-size="17" fill="#b83a29">02 / VISUAL LOCK</text><text x="26" y="93" font-size="33">Identity invariants</text><text x="26" y="130" font-size="19">character, style, exclusions</text></g><g transform="translate(1076 255)"><rect width="438" height="170" fill="#d8d7d1"/><text x="26" y="46" font-size="17" fill="#b83a29">03 / TEMPORAL STRUCTURE</text><text x="26" y="93" font-size="33">Timed story beats</text><text x="26" y="130" font-size="19">one action per interval</text></g><g transform="translate(86 500)"><rect width="438" height="170" fill="#d8d7d1"/><text x="26" y="46" font-size="17" fill="#b83a29">04 / PHYSICAL LOGIC</text><text x="26" y="93" font-size="33">Cause and contact</text><text x="26" y="130" font-size="19">body, space and force</text></g><g transform="translate(581 500)"><rect width="438" height="170" fill="#d8d7d1"/><text x="26" y="46" font-size="17" fill="#b83a29">05 / CAMERA SYSTEM</text><text x="26" y="93" font-size="33">Motivated movement</text><text x="26" y="130" font-size="19">framing, path and hand-off</text></g><g transform="translate(1076 500)"><rect width="438" height="170" fill="#141414"/><text x="26" y="46" font-size="17" fill="#e8e7e0">06 / EVALUATION LOOP</text><text x="26" y="93" font-size="33" fill="#f3f2ee">Compare, diagnose</text><text x="26" y="130" font-size="19" fill="#c9c7be">select the next test</text></g></g>
  <path d="M86 780H1514" stroke="#b83a29" stroke-width="3"/><text x="86" y="856" font-family="Arial, Noto Sans SC, sans-serif" font-size="25" fill="#141414">A prompt is a specification only when its controls can be checked against the finished sequence.</text>
</svg>
