name: Verify portfolio
on:
  push:
    branches: [portfolio-redesign, portfolio-design-v3]
  pull_request:
    branches: [portfolio-redesign]
permissions:
  contents: read
jobs:
  portfolio:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Fetch only publishable LFS downloads
        run: git lfs pull --include="web/public/downloads/*.pdf" --exclude=""
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run check:content && npm run typecheck && npm run lint
        working-directory: web
      - run: node scripts/verify-experiments.mjs && node scripts/verify-scroll-timeline.mjs && node scripts/verify-model.mjs
      - run: npm run build
        working-directory: web
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - name: Check production pages and interactions
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/portfolio-preview.log 2>&1 &
          node ../scripts/qa/browser-v3.mjs
        working-directory: web
        env:
          PORTFOLIO_QA_URL: http://127.0.0.1:4173/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: portfolio-browser-qa
          path: design/qa-v3/
