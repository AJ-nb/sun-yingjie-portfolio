name: Publish portfolio
on:
  push:
    branches: [portfolio-v12-public]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: portfolio-pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PORTFOLIO_BASE_PATH: /sun-yingjie-portfolio/
      VITE_SITE_ORIGIN: https://aj-nb.github.io
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: git lfs pull --include="web/public/downloads/*.pdf" --exclude=""
      - run: npm ci
        working-directory: web
      - run: npm run check:content && npm run check:registry && npm run typecheck && npm run lint && npm run check:invariants
        working-directory: web
      - run: npm run build
        working-directory: web
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
